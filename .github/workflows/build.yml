name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ""

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary release keystore
        working-directory: Syth-Tiles-main
        run: |
          keytool -genkeypair \
            -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storepass github123 \
            -keypass github123 \
            -dname "CN=GitHub Actions, OU=CI, O=Syth-Tiles, L=CI, ST=CI, C=US"

      - name: Create .env
        working-directory: Syth-Tiles-main
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build release APK
        working-directory: Syth-Tiles-main
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: github123
          KEY_PASSWORD: github123
        run: |
          gradle assembleRelease --no-daemon

      - name: Show APK
        working-directory: Syth-Tiles-main
        run: |
          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Syth-Tiles-release
          path: Syth-Tiles-main/app/build/outputs/apk/release/*.apk
          if-no-files-found: error