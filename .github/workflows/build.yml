name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary release keystore
        working-directory: Syth-Tiles-main
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias github-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storepass github123 \
            -keypass github123 \
            -dname "CN=GitHub Actions, OU=CI, O=Syth-Tiles, L=CI, ST=CI, C=US"

      - name: Configure release signing
        working-directory: Syth-Tiles-main
        run: |
          cat > signing.properties <<'EOF'
          storeFile=release.keystore
          storePassword=github123
          keyAlias=github-release
          keyPassword=github123
          EOF

      - name: Create .env
        working-directory: Syth-Tiles-main
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build release APK
        working-directory: Syth-Tiles-main
        run: |
          gradle assembleRelease --no-daemon

      - name: Find APK
        working-directory: Syth-Tiles-main
        run: |
          find app/build/outputs/apk/release -type f -name "*.apk" -print

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Syth-Tiles-release
          path: Syth-Tiles-main/app/build/outputs/apk/release/*.apk
          if-no-files-found: error